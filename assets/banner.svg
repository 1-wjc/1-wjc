<svg width="854" height="170" viewBox="0 0 854 170" xmlns="http://www.w3.org/2000/svg">

  <!-- ===== ① 색 (왼쪽 → 가운데 → 오른쪽) ===== -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0D1117"/>
      <stop offset="40%"  stop-color="#203A43"/>
      <stop offset="100%"  stop-color="#216E39"/>
    </linearGradient>
  </defs>

  <!-- ===== ② 글자 크기·굵기·색 ===== -->
  <style>
    .title { font-size: 40px; font-weight: 700; fill: #ffffff; }
    .desc  { font-size: 18px; font-weight: 500; fill: #ffffff; }
    .title, .desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      animation: fadeIn 1.2s ease-in-out forwards;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>

  <!-- ===== ③ 물결 (opacity: 앞 물결 1 = 원래 색 그대로, 뒤 물결 0.6 = 살짝 비침) ===== -->
  <path fill="url(#bg)" opacity="1">
    <animate attributeName="d" dur="20s" repeatCount="indefinite" begin="0s"
      keyTimes="0;0.333;0.667;1" calcMode="spline" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
      values="M0 0L 0 120Q 213.5 160 427 130T 854 155L 854 0 Z;
              M0 0L 0 145Q 213.5 160 427 140T 854 130L 854 0 Z;
              M0 0L 0 165Q 213.5 135 427 165T 854 130L 854 0 Z;
              M0 0L 0 120Q 213.5 160 427 130T 854 155L 854 0 Z"/>
  </path>
  <path fill="url(#bg)" opacity="0.6">
    <animate attributeName="d" dur="20s" repeatCount="indefinite" begin="-10s"
      keyTimes="0;0.333;0.667;1" calcMode="spline" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
      values="M0 0L 0 135Q 213.5 180 427 150T 854 160L 854 0 Z;
              M0 0L 0 150Q 213.5 120 427 120T 854 140L 854 0 Z;
              M0 0L 0 145Q 213.5 125 427 150T 854 165L 854 0 Z;
              M0 0L 0 135Q 213.5 180 427 150T 854 160L 854 0 Z"/>
  </path>

  <!-- ===== ④ 문구와 세로 위치 (y: 0% 맨 위 ~ 100% 맨 아래) ===== -->
  <!-- 소제목에 & 를 쓸 때는 &amp; 로 적어야 함 -->
  <text class="title" x="50%" y="35%" text-anchor="middle" dominant-baseline="middle">Wonjun Choi</text>
  <text class="desc"  x="50%" y="65%" text-anchor="middle" dominant-baseline="middle">Data Scientist · Multimodal LLM &amp; Applied ML</text>

</svg>
